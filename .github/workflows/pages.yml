name: Deploy to GitHub Pages

on:
  # 推送 v* 形式的 tag 时自动部署（如 v1.0.0、v1.2.3-rc1）
  push:
    tags:
      - 'v*'
  # 支持 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 权限：构建只需读，部署需要写 Pages + OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署实例运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) 构建：检出 → 安装依赖 → 构建 → 上传产物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages 项目页 URL = https://<owner>.github.io/<repo>/
        # Vite base 必须与之匹配，否则打包后的资源路径会 404。
        # 用 ${{ github.event.repository.name }} 动态取仓库名，重命名时不用改这里。
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 2) 部署：消费构建产物，发布到 GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
